<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mart Counter Routing (Flask)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #0b0f12;
      color: #e9eef6;
      padding: 16px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      background: #13171b;
      border: 1px solid #1f2a36;
      border-radius: 10px;
    }

    /* ===============================
       COUNTER TEXT COLORS (FINAL)
       =============================== */

    /* Default: all counter text white */
    .counter-grid .card,
    .counter-grid .card * {
      color: #ffffff;
    }

    /* Counter type (Electronics, Frozen, etc.) */
    .counter-type {
      color: rgba(255, 255, 255, 0.65) !important;
      font-size: 0.9rem;
    }

    /* Idle text green */
    .counter-status.idle {
      color: #00ff99 !important;
      font-weight: 600;
    }

    /* Queue text */
    .counter-queue {
      color: #ffffff !important;
      font-weight: 500;
    }

    /* Muted helper text (outside counters) */
    .small-muted {
      color: #9aa3b2;
      font-size: 0.9rem;
    }

    .queue-item {
      border-bottom: 1px dashed #23272b;
      padding: 6px 0;
      color: #ffffff;
    }

    .counter-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .big-screen {
      border: 3px solid #0d6efd;
      background: #07101a;
      padding: 18px;
      text-align: center;
      border-radius: 8px;
      color: #ffffff;
    }
  </style>
</head>

<body>
<div class="container-fluid">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Mart Counter Routing (Flask)</h2>
    <div>
      <button id="btnAddRandom" class="btn btn-secondary me-2">Add Random Trolley</button>
      <button id="btnAssign" class="btn btn-primary me-2">Assign Next</button>
      <a href="/analytics" target="_blank" class="btn btn-outline-light me-2">View Stats</a>
      <a href="/export_logs" class="btn btn-outline-light">Export CSV</a>
    </div>
  </div>

  <!-- Top Section -->
  <div class="row mb-3">

    <!-- Manual trolley -->
    <div class="col-md-4">
      <div class="card p-3">
        <h5>Create trolley manually</h5>

        <label class="form-label small-muted">Trolley ID (optional)</label>
        <input id="inputTid" type="number" class="form-control mb-2" placeholder="auto">

        <label class="form-label small-muted">Items (Category:qty per line)</label>
        <textarea id="textareaItems" class="form-control" rows="6">Groceries:3
Produce:2</textarea>

        <div class="mt-2">
          <button id="btnAddManual" class="btn btn-success">Add Trolley</button>
          <div id="manualFeedback" class="small-muted mt-2"></div>
        </div>
      </div>
    </div>

    <!-- Pending queue -->
    <div class="col-md-4">
      <div class="card p-3">
        <h5>Pending queue</h5>
        <div id="pendingQueue" style="min-height:120px;"></div>
      </div>
    </div>

    <!-- Big screen -->
    <div class="col-md-4">
      <div class="card p-3">
        <h5>Big Screen</h5>
        <div id="bigScreen" class="big-screen">No assignment yet</div>

        <div class="form-check form-switch mt-3">
          <input class="form-check-input" type="checkbox" id="toggleAuto">
          <label class="form-check-label small-muted">Auto-process (tick every 1s)</label>
        </div>
      </div>
    </div>

  </div>

  <hr style="border-color:#1f2a36">

  <!-- Counters -->
  <h5 class="mb-2">Counters</h5>
  <div id="counters" class="counter-grid"></div>

  <div class="mt-4 small-muted">
    <strong>Notes:</strong>
    Assign uses expected completion =
    (sum of remaining times in counter) + (service time of new trolley).
  </div>

</div>

<!-- ========================= -->
<!-- SERVER DATA (SAFE JSON) -->
<!-- ========================= -->
<script id="app-data" type="application/json">
{
  "numCounters": {{ num_counters }},
  "profiles": {{ profiles | tojson }}
}
</script>

<!-- ========================= -->
<!-- MAIN JAVASCRIPT -->
<!-- ========================= -->
<script>
const APP_DATA = JSON.parse(document.getElementById("app-data").textContent);
const NUM_COUNTERS = APP_DATA.numCounters;
const PROFILES = APP_DATA.profiles;

async function fetchState() {
  const res = await fetch("/state");
  return await res.json();
}

function formatItems(items) {
  return items.map(it => `${it.category} x${it.qty}`).join(", ");
}

function renderState(s) {

  /* Pending queue */
  const pendingDiv = document.getElementById("pendingQueue");
  pendingDiv.innerHTML = "";
  if (!s.pending || s.pending.length === 0) {
    pendingDiv.innerHTML = "<div class='small-muted'>No pending trolleys</div>";
  } else {
    s.pending.forEach(t => {
      const d = document.createElement("div");
      d.className = "queue-item";
      d.innerHTML = `<strong>Trolley ${t.id}</strong> — ${formatItems(t.items)}`;
      pendingDiv.appendChild(d);
    });
  }

  /* Big screen */
  const bs = document.getElementById("bigScreen");
  if (s.last_assignment && s.last_assignment.trolley_id) {
    const a = s.last_assignment;
    const mm = Math.floor(a.est_finish_seconds / 60);
    const ss = Math.floor(a.est_finish_seconds % 60);
    bs.innerHTML = `
      <div style="font-size:28px">Trolley ${a.trolley_id}</div>
      <div style="font-size:14px;opacity:.8">Please go to</div>
      <div style="font-size:34px;color:#00ff99">Counter ${a.counter_id}</div>
      <div style="font-size:12px;opacity:.8">Est finish in ${mm}m ${ss}s</div>
    `;
  } else {
    bs.textContent = "No assignment yet";
  }

  /* Counters */
  const container = document.getElementById("counters");
  container.innerHTML = "";

  for (let i = 1; i <= NUM_COUNTERS; i++) {
    const id = String(i);
    const q = s.counters[id] || [];
    const profile = PROFILES.find(p => String(p.id) === id);
    const paused = s.paused[id];

    let statusHtml = `<span class="counter-status idle">Idle</span>`;
    let progress = 0;

    if (q.length > 0) {
      const head = q[0];
      const rem = head.remaining_seconds;
      const st = head.service_time;
      const mm = Math.floor(rem / 60);
      const ss = Math.floor(rem % 60);
      statusHtml = `T${head.id} — ${mm}m ${ss}s remaining`;
      progress = Math.round((1 - rem / st) * 100);
    }

    const card = document.createElement("div");
    card.className = "card p-3";
    card.style.width = "18rem";

    card.innerHTML = `
      <strong>${profile.name}</strong>
      <div class="counter-type">${profile.spec}</div>

      <div class="mt-2 counter-status">${statusHtml}</div>

      <div class="progress mt-2" style="height:10px">
        <div class="progress-bar" style="width:${progress}%"></div>
      </div>

      <div class="mt-2 counter-queue">Queue: ${q.length}</div>

      <div class="mt-2 d-flex gap-2">
        <button class="btn btn-warning btn-sm" data-finish="${i}">Finish</button>
        <button class="btn btn-sm ${paused ? "btn-success" : "btn-outline-light"}"
                data-pause="${i}">
          ${paused ? "Resume" : "Pause"}
        </button>
      </div>
    `;

    container.appendChild(card);
  }

  document.querySelectorAll("[data-finish]").forEach(btn => {
    btn.onclick = async () => {
      await fetch(`/finish/${btn.dataset.finish}`, { method: "POST" });
      refresh();
    };
  });

  document.querySelectorAll("[data-pause]").forEach(btn => {
    btn.onclick = async () => {
      await fetch(`/toggle_pause/${btn.dataset.pause}`, { method: "POST" });
      refresh();
    };
  });
}

async function refresh() {
  const state = await fetchState();
  renderState(state);
}

document.getElementById("btnAddRandom").onclick = async () => {
  await fetch("/add_random", { method: "POST" });
  refresh();
};

document.getElementById("btnAssign").onclick = async () => {
  await fetch("/assign_next", { method: "POST" });
  refresh();
};

document.getElementById("btnAddManual").onclick = async () => {
  const tid = document.getElementById("inputTid").value;
  const items = document.getElementById("textareaItems").value;

  const res = await fetch("/add_manual", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ tid, items })
  });

  const data = await res.json();
  document.getElementById("manualFeedback").textContent = data.message || "";
  refresh();
};

let autoInterval = null;
document.getElementById("toggleAuto").onchange = (e) => {
  if (e.target.checked) {
    autoInterval = setInterval(async () => {
      await fetch("/tick", { method: "POST" });
      refresh();
    }, 1000);
  } else {
    clearInterval(autoInterval);
  }
};

refresh();
</script>

</body>
</html>
